[workspace]
members = ["crates/phobos-scope-core", "crates/phobos-scope"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Phobos A. D'thorga"]
repository = "https://github.com/phobos-dthorga/phobos-scope"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
